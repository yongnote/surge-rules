name: Update Surge rules
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: update-surge-rules
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download, validate and convert upstream rules
        run: python3 scripts/update_rules.py
      - name: Publish only validated changes
        shell: bash
        run: |
          if git diff --quiet -- sr_ad_only.sgmodule; then
            echo "No rule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- sr_ad_only.sgmodule
          git commit -m "Update validated Surge ad-blocking rules"
          git push origin HEAD:main
